plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.commute'
version = '0.0.1-SNAPSHOT'
description = 'commute-rent-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'io.jsonwebtoken:jjwt:0.12.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    // Source: https://mvnrepository.com/artifact/com.atilika.kuromoji/kuromoji-ipadic
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    implementation 'com.ibm.icu:icu4j:73.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * プロジェクト固有のIntelliJ設定（日英Javadocテンプレート）を同期する。
 * Syncs project-specific IntelliJ settings (bilingual Javadoc templates).
 *
 * <p>
 * - idea-settings/fileTemplates → .idea/fileTemplates（このプロジェクトのみ）
 * - idea-settings/templates → IDE Live Templates（jdc/jdm など）
 * </p>
 */
tasks.register('syncIdeaSettings') {
    group = 'ide'
    description = 'Sync bilingual Javadoc File/Live Templates into IntelliJ for this project'

    def sourceRoot = layout.projectDirectory.dir('idea-settings')
    def projectFileTemplates = layout.projectDirectory.dir('.idea/fileTemplates')
    def liveTemplateSource = sourceRoot.file('templates/CommuteJavadoc.xml')

    inputs.dir(sourceRoot.dir('fileTemplates'))
    inputs.file(liveTemplateSource)
    outputs.dir(projectFileTemplates)

    doLast {
        // 1) File Templates → プロジェクト固有（.idea）
        copy {
            from sourceRoot.dir('fileTemplates')
            into projectFileTemplates
        }
        logger.lifecycle("Synced File Templates → .idea/fileTemplates")

        // 2) Live Templates → IntelliJ IDEA 設定ディレクトリ
        def roaming = System.getenv('APPDATA')
        if (roaming == null) {
            logger.warn('APPDATA not found; skip Live Template sync')
            return
        }
        def jetbrainsDir = file("${roaming}/JetBrains")
        if (!jetbrainsDir.exists()) {
            logger.warn("JetBrains config not found: ${jetbrainsDir}")
            return
        }
        def ideaHomes = jetbrainsDir.listFiles()?.findAll { it.name.startsWith('IntelliJIdea') } ?: []
        if (ideaHomes.isEmpty()) {
            logger.warn('No IntelliJIdea* config directory found')
            return
        }
        ideaHomes.each { ideaHome ->
            def templatesDir = new File(ideaHome, 'templates')
            templatesDir.mkdirs()
            copy {
                from liveTemplateSource.asFile
                into templatesDir
            }
            logger.lifecycle("Synced Live Templates → ${templatesDir}/CommuteJavadoc.xml")
        }
    }
}

// このプロジェクトでビルドするたびに自動適用
tasks.named('compileJava') {
    dependsOn 'syncIdeaSettings'
}

spring.datasource.url=${SERVER_URL:jdbc:mariadb://localhost:3307/commute_rent}
spring.datasource.username=${SERVER_USER}
spring.datasource.password=${SERVER_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# 1. Hibernate 커넥션 풀 로그 활성화 (질문하신 로그 출력)
logging.level.org.hibernate.orm.connections.pooling=INFO

# 2. HikariCP 자체 상세 설정 로그 활성화 (풀 크기, 상태 등 상세 정보 출력)
logging.level.com.zaxxeon.hikari=DEBUG

logging.config=classpath:logback-spring.xml

spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

logging.level.com.zaxxer.hikari=DEBUG
jwt.secret=${JWT_SECRET}